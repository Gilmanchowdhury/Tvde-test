body{font-family:var(--body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:2rem;line-height:1.1}
h2{font-size:1.25rem}
.plate{background:var(--sign);color:var(--sign-ink);border-radius:10px;padding:18px 20px;display:grid;gap:4px;border:3px solid var(--sign);box-shadow:inset 0 0 0 2px var(--sign-ink)}
.plate p{margin:0;opacity:.9}
.lbl{font-family:var(--display);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{padding:10px 6px}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-ink);border-color:var(--sign)}
button{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;cursor:pointer}
button:hover{border-color:var(--sign)}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.opt:disabled{opacity:1}
.opt:disabled:not(.ok):not(.bad){opacity:.55}
.primary{background:var(--sign);color:var(--sign-ink);border-color:var(--sign);font-weight:600}
.modes{display:grid;gap:10px}
.mode{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;align-items:center;padding:14px}
.mode b{font-family:var(--display);font-size:1.15rem}
.mode span{grid-column:2;color:var(--muted);font-size:.92rem}
.glyph{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--sign-ink);background:var(--sign)}
.glyph.tri{border-radius:0;background:none;color:var(--ink);width:44px;height:40px;position:relative}
.glyph.tri::before{content:"";position:absolute;inset:0;background:var(--bad);clip-path:polygon(50% 0,100% 100%,0 100%)}
.glyph.tri::after{content:"";position:absolute;inset:9px 10px 4px;background:var(--panel);clip-path:polygon(50% 0,100% 100%,0 100%)}
.glyph.tri i{position:relative;z-index:1;font-style:normal;margin-top:10px;font-size:.95rem}
.glyph.oct{border-radius:0;background:var(--amber);color:#18212b;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.stats{display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;display:grid;gap:6px}
.barrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.track div{height:100%;background:var(--amber);width:0}
.qtag{font-family:var(--display);font-weight:600;color:var(--muted)}
.qtext{font-size:1.12rem;font-weight:600;margin:0}
.qimg{width:100%;border-radius:6px;border:1px solid var(--line);background:#fff}
.opts{display:grid;gap:8px}
.sq{display:grid;gap:10px;justify-items:center}
.sq .qimg{border:none;border-radius:4px}
.photo{max-height:260px;width:auto;max-width:100%;border-radius:6px}
.zoom{cursor:zoom-in}
#zoom{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.92);overflow:auto;display:grid;place-items:center;gap:10px;padding:max(16px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
#zoom img{max-width:none;width:min(1000px,200vw);height:auto;background:#fff;border-radius:6px}
#zoom[hidden]{display:none}
#zoom span{color:#fff;font-size:.9rem}
.opt{display:grid;grid-template-columns:2rem 1fr;gap:10px;text-align:left;align-items:start;padding:12px}
.opt .k{font-family:var(--display);font-weight:700;width:2rem;height:2rem;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line)}
.letters{display:flex;gap:10px;flex-wrap:wrap}
.letters .opt{grid-template-columns:auto;min-width:64px;justify-items:center;font-family:var(--display);font-size:1.3rem;font-weight:700;padding:10px 18px}
.opt.sel{border-color:var(--sign);box-shadow:inset 0 0 0 1.5px var(--sign)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ink)}
.opt.ok .k{border-color:var(--ok);background:var(--ok);color:var(--panel)}
.opt.bad{background:var(--bad-bg);border-color:var(--bad)}
.opt.bad .k{border-color:var(--bad);background:var(--bad);color:var(--panel)}
.fb{font-weight:600;margin:0}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.nav .grow{flex:1}
.score{font-family:var(--display);font-size:3.2rem;line-height:1;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:3px 12px;border-radius:999px;font-weight:600;font-family:var(--display);letter-spacing:.04em}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.rev{display:grid;gap:12px}
.rev .panel{gap:8px}
.small{font-size:.9rem;color:var(--muted);margin:0}
.confirm{border:1.5px dashed var(--bad);border-radius:8px;padding:12px;display:grid;gap:10px}
@media (max-width:440px){h1{font-size:1.6rem}.seg button{font-size:.9rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="zoom" hidden><img alt="বড় করে দেখা"><span>যেকোনো জায়গায় চাপলে বন্ধ হবে</span></div>
<script>
const DATA={"t":[{"n":1,"q":"O aspeto mais importante para se obter sucesso quando se pretende estabelecer comunicação é:","o":["Fazer perguntas para esclarecer o ponto de vista da outra pessoa.","Ser recetivo ao conteúdo e às emoções da outra pessoa.","Ouvir para compreender.","Demonstrar sempre concordância."],"a":"c"},{"n":2,"q":"Apesar de existirem vários estilos de comunicação devemos utilizar preferencialmente:","o":["Passivo.","Agressivo.","Assertivo."],"a":"c"},{"n":3,"q":"A barreira interna à comunicação está relacionada com:","o":["Má interpretação das palavras.","Pressão do tempo.","Desinteresse e desmotivação.","Estão corretas as respostas a) e c)."],"a":"d"},{"n":4,"q":"As competências exigidas para o desempenho da função de motorista são:","o":["Meramente técnicas.","Organizacionais e técnicas.","Organizacionais, relacionais e técnicas."],"a":"c"},{"n":5,"q":"A imagem de um motorista é formada em 30 segundos, dando-se maior importância a:","o":["Comunicação.","Aparência.","Conhecimento."],"a":"b"},{"n":6,"q":"Quais as características que definem um bom líder?","o":["Ser capaz de apresentar uma visão que outros queiram alcançar.","Ser ambicioso, carismático, confiante, independente e responsável.","Ser capaz de satisfazer as necessidades pessoais e de grupo."],"a":"b"},{"n":7,"q":"O que se entende por comunicação interpessoal?","o":["Método de comunicação que promove a troca de informação entre duas ou mais pessoas.","Método de comunicação efetuado apenas por um interveniente.","Atividade inativa e descontínua de troca de informações."],"a":"a"},{"n":8,"q":"O processo de comunicação prevê a existência mínima de:","o":["Um emissor.","Um recetor.","Um emissor e um recetor."],"a":"c"},{"n":9,"q":"O que se entende por ruídos durante o processo de comunicação?","o":["Algo que interfere com a mensagem enviada, mas que não altera o seu significado.","Algo que interfere com a mensagem enviada bloqueando e alterando o seu significado.","Algo que interfere com a mensagem enviada que bloqueia mas não altera o seu significado."],"a":"b"},{"n":10,"q":"Fazem parte das barreiras internas à comunicação:","o":["Diferenças sociais, culturais, sexuais, os julgamentos e as suposições.","Apenas as diferenças sociais, culturais e sexuais.","Unicamente as diferenças sociais e culturais."],"a":"a"},{"n":11,"q":"Entendem-se por barreiras externas à comunicação:","o":["Os julgamentos.","Os sinais não verbais e as pressões de tempo.","As diferenças sociais e culturais."],"a":"b"},{"n":12,"q":"O relacionamento interpessoal está classificado nos estilos:","o":["Assertivo, passivo, manipulador e agressivo.","Assertivo e agressivo.","Passivo e ativo."],"a":"a"},{"n":13,"q":"Um individuo com estilo assertivo é uma pessoa que:","o":["Concorda sempre com os outros.","Defende os seus próprios interesses.","Valoriza-se à custa dos outros."],"a":"b"},{"n":14,"q":"As pessoas que estabelecem uma comunicação assertiva caracterizam-se por:","o":["Manifestar a sua opinião, respeitando sempre a opinião do outro.","Ter bom sentido de humor.","Aceitar passivamente tudo que lhe é transmitido.","Não aceita qualquer ponto de vista."],"a":"a"},{"n":15,"q":"Os peões e os condutores de velocípedes são considerados utilizadores vulneráveis da via pública.","o":["Certo.","Errado."],"a":"a"},{"n":16,"q":"As crianças, idosos, grávidas e pessoas com mobilidade reduzida são considerados utilizadores vulneráveis da via pública.","o":["Certo.","Errado."],"a":"a"},{"n":17,"q":"Um condutor pode ser titular de mais do que uma carta de condução de modelo comunitário?","o":["Pode.","Não pode."],"a":"b"},{"n":18,"q":"A posição de marcha dos veículos deve fazer-se pelo lado direito da faixa de rodagem:","o":["Conservando das bermas ou passeios uma distância suficiente que permita evitar acidentes.","Não sendo necessário conservar das bermas ou passeios qualquer distância.","Conservando somente uma distância dos passeios que permita evitar acidentes."],"a":"a"},{"n":19,"q":"Nas rotundas, o condutor deve ter o seguinte comportamento:","o":["Se pretender sair da rotunda na primeira via de saída, deve ocupar a via da direita.","Se pretender sair da rotunda na primeira via de saída, pode ocupar qualquer das vias.","Se pretender sair da rotunda na primeira via de saída, pode ocupar qualquer das duas vias mais à direita."],"a":"a"},{"n":20,"q":"Sempre que no mesmo sentido existem duas ou mais vias de trânsito, o condutor deve circular pela via mais à direita:","o":["Podendo utilizar outra se não houver lugar naquela e somente para mudar de direção.","Podendo utilizar outra se não houver lugar naquela e também para ultrapassar ou mudar de direção.","Podendo utilizar outra se não houver lugar naquela e somente para ultrapassar."],"a":"b"},{"n":21,"q":"Os velocípedes podem circular nas bermas?","o":["Sim, desde que não ponham em perigo ou perturbem os peões que nelas circulem.","Não, os velocípedes nunca podem circular nas bermas.","Sim, os velocípedes podem circular nas bermas sem qualquer problema."],"a":"a"},{"n":22,"q":"Os velocípedes podem circular nos passeios?","o":["Não. Os velocípedes nunca podem circular nos passeios.","Sim, se forem conduzidos por crianças até aos 10 anos, desde que não ponham em perigo ou perturbem os peões."],"a":"b"},{"n":23,"q":"O condutor deve regular a velocidade:","o":["Atendendo somente às características e estado do veículo.","Atendendo à presença de utilizadores vulneráveis.","Atendendo somente à carga transportada."],"a":"b"},{"n":24,"q":"O condutor deve regular a velocidade:","o":["Atendendo à presença de utilizadores vulneráveis","Atendendo somente à intensidade do trânsito.","Atendendo somente à carga transportada no veículo."],"a":"a"},{"n":25,"q":"A velocidade deve ser especialmente moderada:","o":["Unicamente nas descidas de inclinação acentuada.","Unicamente nas pontes, túneis e passagens de nível.","Nas zonas de coexistência."],"a":"c"},{"n":26,"q":"A velocidade deve ser especialmente moderada:","o":["À aproximação de utilizadores vulneráveis.","Unicamente nas descidas de inclinação acentuada.","Unicamente nos locais de grande intensidade de trânsito."],"a":"a"},{"n":27,"q":"Dentro das localidades, em zonas de coexistência os automóveis ligeiros de passageiros sem reboque:","o":["Não podem exceder a velocidade de 30 km/h.","Não podem exceder a velocidade de 20 km/h.","Não podem exceder a velocidade de 50 km/h."],"a":"b"},{"n":28,"q":"Os motoristas de TVDE devem ceder a passagem aos velocípedes:","o":["Que atravessem a faixa de rodagem nas passagens assinaladas.","Que saiam de um parque de estacionamento.","Que entrem numa rotunda."],"a":"a"},{"n":29,"q":"O motorista de TVDE deve ceder a passagem a um veículo que sai de um estacionamento.","o":["Certo.","Errado."],"a":"b"},{"n":30,"q":"Na realização da manobra de ultrapassagem a um velocípede, o motorista de TVDE:","o":["Deve guardar uma distância lateral mínima de 1,5 m e abrandar a velocidade.","Não necessita de ter qualquer precaução.","Deve guardar uma distância lateral mínima de 2,5 metros."],"a":"a"},{"n":31,"q":"Existindo mais do que uma via de trânsito no mesmo sentido, na realização de uma manobra de ultrapassagem, o motorista de TVDE:","o":["Deve ocupar a via de trânsito à esquerda daquela em que circula o veículo ultrapassado.","Pode ocupar qualquer das vias à esquerda do veículo ultrapassado."],"a":"a"},{"n":32,"q":"É proibida a ultrapassagem:","o":["Somente mas passagens assinaladas para a travessia de peões.","Imediatamente antes e nas passagens assinaladas para a travessia de peões e velocípedes.","Somente nas lombas."],"a":"b"},{"n":33,"q":"Nas zonas de coexistência partilhadas por peões e veículos:","o":["Não existe sinalização nem regras especiais de trânsito.","Existem regras especiais de trânsito."],"a":"b"},{"n":34,"q":"A posição de marcha dos veículos deve fazer-se:","o":["Do lado direito da faixa de rodagem.","Do lado esquerdo da faixa de rodagem."],"a":"a"},{"n":35,"q":"A posição de marcha dos veículos deve fazer-se:","o":["Do lado esquerdo da faixa de rodagem.","A uma distância das bermas que ou passeios suficiente, que permita evitar acidentes.","O mais perto possível das bermas ou passeios."],"a":"b"},{"n":36,"q":"O condutor, para falar ao telefone:","o":["Deve utilizar a mão esquerda.","Deve utilizar a mão direita.","Deve colocar um microfone com sistema de alta voz, cuja utilização não implique manuseamento continuado."],"a":"c"},{"n":37,"q":"Deve utilizar o colete retrorrefletor, quem procede à remoção da carga, no caso de imobilização do veículo na faixa de rodagem.","o":["Certo.","Errado."],"a":"a"},{"n":38,"q":"É permitido o trânsito de veículos com avaria nas luzes, desde que disponham de:","o":["O médio do lado esquerdo, conjuntamente com dois mínimos e à retaguarda, o indicador de presença do lado esquerdo e uma das luzes de travagem, quando obrigatória.","O médio do lado direito, conjuntamente com dois mínimos e à retaguarda, o indicador de presença do lado esquerdo e uma das luzes de travagem, quando obrigatória.","O médio do lado direito, conjuntamente com um dos mínimos e à retaguarda, o indicador de presença do lado esquerdo e uma das luzes de travagem, quando obrigatória."],"a":"a"},{"n":39,"q":"Legalmente, considera-se condução sob a influência do álcool, quando o condutor apresenta:","o":["Uma taxa de álcool no sangue inferior a 0,5 g/l.","Uma taxa de álcool no sangue de 0,3 g/l.","Uma taxa de álcool no sangue igual ou superior a 0,5 g/l."],"a":"c"},{"n":40,"q":"As crianças com menos de 12 anos de idade e altura inferior a 135cm, podem ser transportadas em automóvel apenas com o cinto de segurança?","o":["Sim podem, sem qualquer restrição.","Não. As crianças podem ser transportadas mas utilizando um sistema de retenção homologado e adaptado ao seu tamanho."],"a":"b"},{"n":41,"q":"Com que idade e altura as crianças podem ser transportadas em automóvel com um sistema de retenção homologada e adaptado ao seu tamanho?","o":["Crianças com menos de 12 anos e altura inferior a 135 cm.","Crianças com menos de 12 anos e altura inferior a 150 cm.","Não existem idades nem alturas definidas."],"a":"a"},{"n":42,"q":"O condutor de um automóvel ligeiro, com 20 anos de idade, considera-se sob influência do álcool, quando apresenta uma taxa de álcool por litro de sangue igual ou superior a:","o":["0,2 g/l de sangue.","0,3 g/l de sangue.","0,5 g/l de sangue."],"a":"a"},{"n":43,"q":"O condutor de um veículo de transporte público de passageiros (TVDE) é considerado sob influência do álcool, quando apresenta uma taxa de álcool por litro de sangue igual ou superior a:","o":["0,2 g/l de sangue.","0,3 g/l de sangue.","0,5 g/l de sangue."],"a":"a"},{"n":44,"q":"Pratica uma contraordenação grave o condutor de um TVDE ao conduzir com uma taxa de álcool por litro de sangue de:","o":["0,7 g/l de sangue.","0,4 g/l de sangue.","0,2 g/l de sangue."],"a":"c"},{"n":45,"q":"O condutor de um TVDE que conduza com uma taxa de álcool no sangue de 1,3 g/l, pratica:","o":["Uma infração grave","Uma infração muito grave.","Um crime rodoviário."],"a":"c"},{"n":46,"q":"Os condutores que se recusem a submeter-se às provas para \"deteção do estado de influenciado pelo álcool\" mas continuam a conduzir, são punidos:","o":["Por crime de desobediência qualificada e são impedidos de conduzir.","Cometem uma infração muito grave, mas podem continuar a conduzir."],"a":"a"},{"n":47,"q":"Devem submeter-se às provas para a \"deteção do estado de influenciado\" pelo álcool:","o":["Todos os condutores, peões e pessoas que se propuserem iniciar a condução.","Apenas os condutores e os peões.","Apenas os condutores e peões intervenientes em acidentes de trânsito."],"a":"a"},{"n":48,"q":"Quem apresentar um resultado positivo no exame de pesquisa do álcool, fica impedido de conduzir pelo período de:","o":["10 horas.","12 horas.","14 horas."],"a":"b"},{"n":49,"q":"Quem apresentar um resultado positivo no exame de pesquisa do álcool, pode conduzir passadas 10 horas.","o":["Certo","Errado."],"a":"b"},{"n":50,"q":"Quem apresentar um resultado positivo no exame de pesquisa do álcool, pode conduzir passadas 14 horas.","o":["Certo.","Errado."],"a":"a"},{"n":51,"q":"Se o resultado de pesquisa do álcool no sangue for positivo, o condutor pode pedir uma contra prova no ar expirado ou no sangue. A escolha do método a utilizar é feita:","o":["Pela entidade fiscalizadora.","Pelo próprio condutor."],"a":"b"},{"n":52,"q":"No caso da contra prova confirmar um teor de álcool no sangue superior ao limite legal, quem paga as despesas deste exame?","o":["A entidade fiscalizadora que o efetuou.","O hospital, no caso de análise de sangue.","O condutor que a requereu.","O Instituto da Mobilidade e dos Transportes."],"a":"c"},{"n":53,"q":"Se o resultado da contra prova de pesquisa do álcool no sangue apresentar um resultado diferente do primeiro exame de pesquisa do álcool, qual prevalece?","o":["O resultado da contra prova prevalece sobre o do exame inicial.","O resultado do exame inicial prevalece sobre o da contra prova","Nenhum e o condutor deve ser submetido a novo exame de pesquisa para desempate."],"a":"a"},{"n":54,"q":"Quando a entidade fiscalizadora suspeite da utilização de meios suscetíveis de alterar o resultado do exame no ar expirado, pode:","o":["Mandar submeter o condutor a um exame médico.","Mandar submeter o condutor a uma análise de sangue."],"a":"a"},{"n":55,"q":"A ingestão de bebidas alcoólicas:","o":["Torna o condutor mais consciente do perigo.","Aumenta a atenção do condutor.","Diminui a capacidade de reação do condutor."],"a":"c"},{"n":56,"q":"Qual é a influência da ingestão de bebidas alcoólicas na condução?","o":["Aumenta a capacidade de reação.","Diminui a resistência física do condutor.","Aumenta os reflexos do condutor."],"a":"b"},{"n":57,"q":"Não deve conduzir na via publica um condutor com taxa de alcoolemia:","o":["Inferior a 0,2 g/l.","Igual ou superior a 0,5 g/l."],"a":"b"},{"n":58,"q":"Existem medicamentos capazes de prejudicar o desempenho do indivíduo ao volante?","o":["Sim.","Sim, mas apenas se forem ingeridos juntamente com bebidas alcoólicas.","Sim, mas apenas se forem soporíferos."],"a":"a"},{"n":59,"q":"O condutor que pretende sair da rotunda na primeira via de saída e não se encontra corretamente posicionado nessa via:","o":["É sancionado com uma coima.","Não lhe é aplicada nenhuma coima."],"a":"a"},{"n":60,"q":"Para além do fator velocidade, a distância de travagem pode aumentar, se:","o":["O veículo não circular em autoestrada.","O piso se encontrar seco.","O veículo não estiver carregado.","O pavimento se encontrar molhado."],"a":"d"},{"n":61,"q":"A velocidade de um veículo deve depender:","o":["Apenas da intensidade do trânsito.","Do estado da via e do veículo, da intensidade do trânsito e da carga transportada.","Apenas do estado da via."],"a":"b"},{"n":62,"q":"No exercício da condução, considera-se muito grave a seguinte contra ordenação:","o":["A utilização de máximos de modo a provocar encandeamento.","A paragem ou o estacionamento nas bermas das auto-estradas ou vias equiparadas.","O trânsito de veículos em sentido oposto ao estabelecido."],"a":"a"},{"n":63,"q":"Numa rotunda devidamente sinalizada, tem prioridade de passagem os veículos que:","o":["Circulam na rotunda.","Entram na rotunda.","Saem da rotunda."],"a":"a"},{"n":64,"q":"É considerado \"reincidente\" o condutor que cometa uma contraordenação, depois de ter sido condenado por outra contraordenação ao mesmo diploma legal ou seus regulamentos, também sancionado com sanção acessória, praticada a menos de:","o":["5 anos.","3 anos.","2 anos."],"a":"a"},{"n":65,"q":"Nos termos da legislação em vigor, é considerado crime a condução com uma taxa de álcool no sangue igual ou superior a:","o":["0,40 g/l","0,80 g/l","1,20 g/l"],"a":"c"},{"n":66,"q":"Um dos efeitos do álcool no condutor é o aumento:","o":["Da capacidade de reação.","Do tempo de reação."],"a":"b"},{"n":67,"q":"A condução com uma taxa de alcoolémia igual ou superior a 1,20 g/l é considerada:","o":["Uma contra ordenação grave.","Um ilícito criminal.","Uma desobediência qualificada."],"a":"b"},{"n":68,"q":"Um condutor ecológico:","o":["Engrena mudanças mais baixas para diminuir a rotação do motor.","Desembraia o veículo nas descidas de inclinação acentuada.","Conduz com velocidade mais constante, evitando acelerações e travagens bruscas."],"a":"c"},{"n":69,"q":"O condutor de um veículo pode atravessar uma passagem de nível:","o":["Após se certificar de que a intensidade do trânsito não obriga à imobilização do veículo sobre a passagem de nível, ainda que a sinalização lhe permita o atravessamento.","Após verificar que, apesar da aproximação de um comboio, ainda dispõe de tempo suficiente para efetuar o atravessamento da passagem.","Após verificar que os meios de proteção não estão atravessados na via publica, embora a intensidade do trafego possa dar origem a ter que parar sobre a passagem de nível."],"a":"a"},{"n":70,"q":"Considera-se sob a influência do álcool, o motorista de TVDE que apresente uma taxa de álcool no sangue igual ou superior a:","o":["1,2 g/l.","0,8 g/l.","0,2 g/l.","Todas as respostas estão certas."],"a":"d"},{"n":71,"q":"Se precisar de utilizar o telemóvel, deve:","o":["Reduzir a velocidade.","Passar para a via de trânsito da direita.","Estacionar devidamente o veículo."],"a":"c"},{"n":72,"q":"A luz amarela constante do sinal luminoso antecede a luz:","o":["Vermelha.","Verde.","Amarela intermitente."],"a":"a"},{"n":73,"q":"Regra geral, numa localidade a velocidade máxima permitida é:","o":["60Km/h.","50Km/h.","40km/h."],"a":"b"},{"n":74,"q":"A que distância deve estar bem visível o triângulo de pré-sinalização de perigo?","o":["A pelo menos, 150 metros.","A pelo menos, 100 metros.","A pelo menos, 50 metros."],"a":"b"},{"n":75,"q":"Uma das formas de praticar uma condução mais ecológica é:","o":["Verificar regularmente a pressão dos pneus.","Não conduzir com pesos desnecessários no veículo.","Conduzir com o veículo desembraiado nas descidas ingremes.","As afirmações a) e b) estão corretas."],"a":"d"},{"n":76,"q":"O condutor contribui para uma maior proteção do ambiente:","o":["Utilizando o ar condicionado só em situações de necessidade.","Usando sempre a relação de caixa de velocidades o mais alto possível, independentemente da velocidade a que circular.","Fazendo uso de acessórios que provoquem o aumento da resistência aerodinâmica do veículo."],"a":"a"},{"n":77,"q":"Quais são os benefícios da prática generalizada da eco condução?","o":["Contribui para o aumento da emissão de gases com efeito de estufa para o arrefecimento global da atmosfera.","Leva a um aumento significativo do número de veículos em circulação.","Contribui para o aumento do uso de energias renováveis no uso dos transportes rodoviários."],"a":"c"},{"n":78,"q":"Um condutor que apresente resultado positivo no exame de pesquisa de álcool no ar expirado, mediante a utilização de aparelho aprovado para o efeito, fica impedido de conduzir pelo período de:","o":["6 horas.","8 horas.","12 horas."],"a":"c"},{"n":79,"q":"Um condutor ecológico deve:","o":["Evitar colocar muita bagagem no porta bagagens.","Evitar conduzir veículos com motores híbridos.","Evitar usar o ar condicionado do veículo, especialmente em percursos curtos.","As afirmações de R: a) e R: c) estão corretas."],"a":"d"},{"n":80,"q":"Um aumento de 10% na velocidade pode provocar um aumento de 15% no consumo de combustível.","o":["A afirmação é verdadeira.","A afirmação é falsa."],"a":"a"},{"n":81,"q":"A eco condução é uma forma de condução eficiente, menos poluente e mais segura.","o":["A afirmação é verdadeira.","A afirmação é falsa."],"a":"a"},{"n":82,"q":"Quais são as vantagens da prática de uma eco condução?","o":["Contribui para a diminuição do nível de dióxido de carbono na atmosfera e de outros gases com efeito de estufa.","Aumenta o conforto dos ocupantes do veículo.","Contribui para uma menor poluição sonora.","Todas as afirmações anteriores são verdadeiras."],"a":"d"},{"n":83,"q":"A prática da eco condução contribui para:","o":["A otimização do consumo de combustível e a redução da poluição ambiental.","O aumento da sinistralidade rodoviária, embora possa causar embaraço no trânsito.","Um melhor planeamento das viagens, de forma a evitar os congestionamentos de trânsito.","As afirmações de a) e c) estão corretas."],"a":"d"},{"n":84,"q":"Um condutor faz uma condução ecológica, se ao conduzir a uma determinada velocidade:","o":["Utilizar uma rotação constante do motor, engrenando a mudança adequada a esta rotação.","Utilizar uma rotação do motor alta, engrenando mudanças mais baixas.","Utilizar uma rotação do motor baixa, engrenando mudanças mais altas."],"a":"c"},{"n":85,"q":"Como deve proceder o condutor em descidas de inclinação acentuada?","o":["Deve colocar o veículo em ponto morto, de forma a manter o motor liberto.","Deve manter o veículo engrenado numa mudança compatível, ajudando a travagem com o motor.","Nenhuma das afirmações está correta."],"a":"b"},{"n":86,"q":"A prática da eco condução também contribui para a diminuição da sinistralidade rodoviária?","o":["Sim, contribui.","Não, apenas contribui para a redução do consumo de combustível e da poluição ambiental.","Não, apenas contribui para a diminuição das emissões de gases com efeito de estufa."],"a":"a"},{"n":87,"q":"O que é o consumo médio de um veículo?","o":["É o volume final consumido, em litros, após percorrida uma certa distância.","É o volume de combustível, em litros, dividido pela distância percorrida, em km.","É a medida do consumo num determinado instante de tempo."],"a":"b"},{"n":88,"q":"Para que serve o conta-rotações?","o":["Para controlar a velocidade do motor.","Para indicar a rotação do motor do veículo.","Ambas as afirmações são verdadeiras."],"a":"b"},{"n":89,"q":"A correta pressão dos pneus contribui para uma condução mais económica?","o":["Sim, contribui.","Não, apenas contribui para uma melhor estabilidade do veículo.","Não, apenas contribui para a manutenção do sistema de suspensão do veículo."],"a":"a"},{"n":90,"q":"Entende-se por \"condução defensiva\":","o":["Não efetuar ultrapassagens em vias com duas vias de trânsito.","Conduzir de forma a prevenir, evitar e não provocar acidentes, sejam quais forem as condições de circulação, da via, do veículo e meteorológicas e quaisquer que sejam os comportamentos dos outros utentes da via.","Efetuar constantes travagens."],"a":"b"},{"n":91,"q":"O veículo deve ser apreendido numa ação de fiscalização, sempre que:","o":["Sejam desrespeitadas as regras relativas à poluição sonora do solo e do ar.","Não tenha sido efetuado o seguro de responsabilidade civil nos termos da lei.","Se suspeite de viciação fraudulenta no documento de identificação do veículo."],"a":"b"},{"n":92,"q":"A segurança rodoviária depende:","o":["Exclusivamente da sinalização.","Unicamente do comportamento do utente, enquanto peão.","Do equilíbrio que deve existir entre vários elementos que fazem parte do sistema de circulação."],"a":"c"},{"n":93,"q":"O acidente continua a ter como principal causa:","o":["A má sinalização de obras na via pública.","A falha humana, pela não adaptação às condições do ambiente rodoviário.","Os limites de velocidade impostos quando existem obras no pavimento."],"a":"b"},{"n":94,"q":"A avaliação que cada condutor faz de uma situação, depende muito da sua experiência na condução.","o":["Certo.","Errado."],"a":"a"},{"n":95,"q":"Se aumentar a velocidade, a distância de segurança, deve:","o":["Aumentar.","Diminuir.","Manter-se."],"a":"a"},{"n":96,"q":"A distância de travagem varia com:","o":["As condições atmosféricas.","A largura da via.","A sinalização vertical existente no local."],"a":"a"},{"n":97,"q":"Conduzir com chuva tem como resultado:","o":["O aumento de aderência ao piso.","A diminuição da distância de paragem.","A redução da visibilidade."],"a":"c"},{"n":98,"q":"A condução sob a influência do álcool provoca no condutor:","o":["O aumento do tempo de reação.","A diminuição do tempo de reação.","O aumento dos seus reflexos."],"a":"a"},{"n":99,"q":"A capacidade de prever e antecipar enquanto condutor defensivo aumenta:","o":["Com a idade.","Com a experiência de condução."],"a":"b"},{"n":100,"q":"Dos seguintes fatores, qual considera mais importante na prevenção de acidentes rodoviários?","o":["Ter um automóvel novo.","Obter a carta de condução em idade avançada.","Praticar uma condução defensiva."],"a":"c"},{"n":101,"q":"Se a velocidade aumentar, a distância de segurança:","o":["Não se altera.","Deve ser menor.","Deve também aumentar."],"a":"c"},{"n":102,"q":"Um dos efeitos da fadiga na condução traduz-se na diminuição:","o":["Da rapidez dos reflexos.","Do tempo de reação.","Da distância de paragem."],"a":"a"},{"n":103,"q":"Numa viagem longa, para evitar a fadiga, é aconselhável:","o":["Fumar e ouvir musica muito alta.","Parar, sair do veículo e descansar.","Aumentar a velocidade."],"a":"b"},{"n":104,"q":"Numa viagem longa é aconselhável o condutor descansar:","o":["Apenas de 5 em 5 horas.","De 2 em 2 horas.","Só depois de ter percorrido os primeiros 500 km/h."],"a":"b"},{"n":105,"q":"Regra geral, um condutor distraído tem:","o":["Um tempo de reação mais reduzido.","Um tempo de reação mais longo.","O mesmo tempo de reação que qualquer outro condutor."],"a":"b"},{"n":106,"q":"A ingestão de bebidas alcoólicas:","o":["Diminui o campo visual.","Alarga o campo visual.","Não afeta o campo visual."],"a":"a"},{"n":107,"q":"Após ingerir bebidas alcoólicas, os obstáculos que o condutor avista à sua frente na via pública, parecem-lhe:","o":["Mais próximos.","Mais longe.","À distância real."],"a":"b"},{"n":108,"q":"Dos seguintes combustíveis, qual é o menos poluente?","o":["Gasolina sem chumbo.","Gás.","Gasolina com chumbo."],"a":"b"},{"n":109,"q":"Regra geral, a obrigação de segurar o veículo recai sobre:","o":["O proprietário.","O vendedor.","O comprador.","Instituto da Mobilidade e dos Transportes."],"a":"a"},{"n":110,"q":"Caso o condutor seja envolvido num acidente rodoviário, deve identificar-se:","o":["Só aos agentes de autoridade.","Apenas se houver feridos.","Aos envolvidos no acidente e às autoridades."],"a":"c"},{"n":111,"q":"Em caso de acidente, a identificação do condutor é obrigatória?","o":["Não, nunca.","Apenas é obrigatória a identificação do proprietário do veículo.","Sim, bem como a identificação do proprietário do veículo."],"a":"c"},{"n":112,"q":"O condutor interveniente em acidente, deve fornecer aos restantes intervenientes a identificação da sua Seguradora e o número da apólice:","o":["Certo.","Errado."],"a":"a"},{"n":113,"q":"Num acidente de viação em que haja culpa do motorista, pelos danos que o veículo causar, responde:","o":["Somente o motorista.","Solidariamente o motorista e o proprietário do veículo se não for ele próprio o dono.","Apenas a companhia de seguros para a qual o proprietário do veículo transferiu a sua responsabilidade."],"a":"c"},{"n":114,"q":"A reparação dos danos causados por responsável desconhecido ou isento da obrigação do seguro ou por responsável incumpridor da obrigação de seguro de responsabilidade civil automóvel é garantida pelo:","o":["Fundo de Garantia Automóvel.","Gabinete Português da Carta Verde.","Instituto de Seguros de Portugal."],"a":"a"},{"n":115,"q":"O seguro obrigatório de responsabilidade civil automóvel:","o":["Transmite-se sempre com a venda do veículo segurado.","Só se transmite quando o vendedor der o seu consentimento.","Não se transmite com a venda do veículo."],"a":"c"},{"n":116,"q":"Num acidente de viação em que haja culpa do motorista, empregado de um operador de TVDE , pelos danos que o veículo causar a outrem, responde:","o":["Apenas o motorista.","Solidariamente o motorista, o operador de TVDE e a companhia de seguros.","Apenas a companhia de seguros."],"a":"c"},{"n":117,"q":"O seguro obrigatório de responsabilidade civil automóvel garante as indemnizações d "},{"n":124,"q":"Se um cliente se esquece de qualquer coisa dentro do veículo:","o":["O motorista deve entregar o objeto esquecido o mais rapidamente possível à autoridade policial.","O motorista pode ficar com o objeto esquecido dentro do seu veículo."],"a":"a"},{"n":125,"q":"O motorista não se deve preocupar com o aspeto de asseio exterior do veículo.","o":["O motorista só tem que se preocupar com o asseio interior do veículo.","O motorista deve preocupar-se em manter o veículo limpo na parte exterior e no interior do veículo."],"a":"b"},{"n":126,"q":"O motorista de TVDE não deve sair do veículo para ajudar um cliente com mobilidade reduzida.","o":["Certo.","Errado."],"a":"b"},{"n":127,"q":"Para tratar uma queimadura de 1º grau, deve-se:","o":["Aplicar água corrente até existir pouca ou nenhuma dor.","Aplicar uma boa quantidade de creme.","Limpar a área com água quente e sabão."],"a":"a"},{"n":128,"q":"Ao ligar para o 112, o que deve ser mencionado?","o":["Quem, o quê e onde.","Onde, o quê e porquê.","Porquê, quando e onde."],"a":"a"},{"n":129,"q":"Na presença de um acidente e para sua própria segurança, deve:","o":["Atuar com calma e confiança de acordo com os seus conhecimentos.","Chamar o 112 só após ter dados muito concretos sobre a gravidade do acidente.","Atuar imediatamente, embora desconheça a situação dos acidentados."],"a":"a"},{"n":130,"q":"Caso identifique que existe um acidente com vítimas, que número deve ligar para pedir ajuda?","o":["112.","113.","115."],"a":"a"},{"n":131,"q":"Na sequência de um acidente, se houver um ferido que esteja com uma hemorragia de grande dimensão, o que devo fazer mesmo antes de ligar para o 112?","o":["Entrar em pânico.","Ir buscar agua oxigenada.","Tentar controlar a hemorragia."],"a":"c"},{"n":132,"q":"No caso de uma vítima respirar mas esteja inconsciente, o que devo fazer antes de ligar para o 112?","o":["Colocar a vítima na posição lateral de segurança.","Colocar a vítima de barriga para o solo.","Colocar a vítima s DATA.t.forEach(x=>Q['t'+x.n]={...x,key:'t'+x.n,k:x.o.length});
DATA.s.forEach(x=>Q['s'+x.n]={...x,key:'s'+x.n});
const T_KEYS=DATA.t.map(x=>'t'+x.n), S_KEYS=DATA.s.map(x=>'s'+x.n);
const PASS=80;
const L='abcd'.split('');
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let st={src:'t',wrong:new Set(load('tvdet_wrong',[])),sess:load('tvdet_sess',null),pos:load('tvdet_pos',{}),view:'home',confirm:false,result:null};
function persist(){save('tvdet_src',st.src);save('tvdet_wrong',[...st.wrong]);save('tvdet_sess',st.sess);save('tvdet_pos',st.pos)}
function pool(src){return src==='t'?T_KEYS:src==='s'?S_KEYS:T_KEYS.concat(S_KEYS)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SRC_NAME={t:'থিওরি',s:'সাইন ও নিয়ম',all:'সব প্রশ্ন'};
const MODE_NAME={practice:'প্র্যাকটিস',mock:'মক পরীক্ষা',wrong:'ভুলগুলো আবার'};
function fmt(ms){const s=Math.floor(ms/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(x).padStart(2,'0')}
function srcLabel(key){return key[0]==='t'?'থিওরি · প্রশ্ন '+key.slice(1):'সাইন · প্রশ্ন '+key.slice(1)}

function home(){
  const p=pool(st.src), wrongIn=p.filter(k=>st.wrong.has(k)).length;
  const s=st.sess;
  app.innerHTML=`
  <header class="plate"><span class="lbl" style="color:inherit;opacity:.85">CMTVDE · IMT</span><h1>TVDE থিওরি টেস্ট</h1>
  <p>থিওরি ২৩১টা প্রশ্ন</p><p style="margin-top:6px;font-weight:600;opacity:1">তৈরি করেছেন: GILMAN CHOWDHURY</p></header>
  ${s?`<section class="panel"><span class="lbl">অসমাপ্ত</span>
    <div><b>${MODE_NAME[s.mode]}</b> · ${SRC_NAME[s.src]} · ${Object.keys(s.ans).length}/${s.ids.length} উত্তর দেওয়া</div>
    <div class="nav"><button class="primary grow" id="resume">যেখানে ছিলেন সেখান থেকে চালিয়ে যান</button><button id="drop">বাতিল করুন</button></div></section>`:''}
  <section class="panel" hidden><span class="lbl">কোন প্রশ্নগুলো</span>
    <div class="seg">${['t','s','all'].map(k=>`<button data-src="${k}" aria-pressed="${st.src===k}">${SRC_NAME[k]}<br><small>${pool(k).length}টা</small></button>`).join('')}</div>
  </section>
  <section class="modes">
    <button class="mode" data-mode="practice"><span class="glyph">P</span><b>প্র্যাকটিস</b><span>ক্রম অনুযায়ী, প্রতিটা উত্তরের সাথে সাথে ঠিক/ভুল আর ব্যাখ্যা। আগের জায়গা মনে রাখে।</span></button>
    <button class="mode" data-mode="mock"><span class="glyph oct">✓</span><b>মক পরীক্ষা</b><span>সব ${p.length}টা প্রশ্ন এলোমেলো ক্রমে, টাইমার চলবে। ফলাফল শেষে, পাস মার্ক ${PASS}%। মাঝপথে থামলে পরে চালিয়ে যাওয়া যাবে।</span></button>
    <button class="mode" data-mode="wrong" ${wrongIn?'':'disabled'}><span class="glyph tri"><i>!</i></span><b>ভুলগুলো আবার</b><span>${wrongIn?`এই বিভাগে ${wrongIn}টা ভুল প্রশ্ন জমা আছে। ঠিক করলে তালিকা থেকে বাদ যাবে।`:'এখনও কোনো ভুল জমা নেই।'}</span></button>
  </section>
  <p class="small" style="text-align:center">© GILMAN CHOWDHURY</p><div class="stats"><span>মোট ভুল জমা: ${st.wrong.size}</span>${st.wrong.size?'<button id="clearw" style="padding:2px 10px">ভুলের তালিকা মুছুন</button>':''}</div>`;
  app.querySelectorAll('[data-src]').forEach(b=>b.onclick=()=>{st.src=b.dataset.src;persist();home()});
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>start(b.dataset.mode));
  const r=document.getElementById('resume'); if(r) r.onclick=()=>{st.view='q';render()};
  const d=document.getElementById('drop'); if(d) d.onclick=()=>{st.sess=null;persist();home()};
  const c=document.getElementById('clearw'); if(c) c.onclick=()=>{st.wrong.clear();persist();home()};
}
function start(mode){
  const p=pool(st.src); let ids, i=0;
  if(mode==='practice'){ids=p; i=Math.min(st.pos[st.src]||0,p.length-1)}
  else if(mode==='mock') ids=shuffle(p);
  else ids=shuffle(p.filter(k=>st.wrong.has(k)));
  st.sess={mode,src:st.src,ids,i,ans:{},start:Date.now(),elapsed:0};
  st.view='q';persist();render();
}
let tick=null;
function render(){clearInterval(tick);window.scrollTo(0,0);if(st.view==='home')home();else if(st.view==='result')result();else question()}
function sq(q){return `<div class="sq"><img class="qimg zoom" src="${q.i}" alt="প্রশ্ন ${q.n}" loading="lazy"></div>`}
document.addEventListener('click',e=>{const z=document.getElementById('zoom');
  if(e.target.classList&&e.target.classList.contains('zoom')){z.querySelector('img').src=e.target.src;z.hidden=false}
  else if(e.target.closest&&e.target.closest('#zoom')){z.hidden=true}});
function question(){
  const s=st.sess, key=s.ids[s.i], q=Q[key], chosen=s.ans[key], instant=s.mode!=='mock', revealed=instant&&chosen;
  const done=Object.keys(s.ans).length;
  const optCls=l=>{if(revealed){if(l===q.a)return 'ok';if(l===chosen)return 'bad';return ''}return chosen===l?'sel':''};
  let body;
  if(key[0]==='t'){
    body=`<p class="qtext">${esc(q.q)}</p><div class="opts">${q.o.map((o,j)=>`<button class="opt ${optCls(L[j])}" data-l="${L[j]}" ${revealed?'disabled':''}><span class="k">${L[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }else{
    body=`${sq(q)}<div class="letters">${L.slice(0,q.k).map(l=>`<button class="opt ${optCls(l)}" data-l="${l}" ${revealed?'disabled':''}>${l})</button>`).join('')}</div>`;
  }
  let fb='';
  if(revealed){fb=`<p class="fb ${chosen===q.a?'ok':'bad'}">${chosen===q.a?'ঠিক উত্তর!':'ভুল। সঠিক উত্তর: '+q.a+')'}</p>${q.e?`<img class="qimg zoom" src="${q.e}" alt="ব্যাখ্যা">`:''}`}
  const last=s.i===s.ids.length-1;
  app.innerHTML=`
  <div class="bar"><div class="barrow"><button id="home" style="padding:6px 12px">← হোম</button>
    <span><b>${s.i+1}</b> / ${s.ids.length}</span>
    <span>${s.mode==='mock'?`⏱ <span id="clock">${fmt(s.elapsed)}</span>`:MODE_NAME[s.mode]}</span></div>
    <div class="track"><div style="width:${(s.mode==='mock'?done:s.i+1)/s.ids.length*100}%"></div></div></div>
  <section class="panel"><span class="qtag">${srcLabel(key)}</span>${body}${fb}</section>
  <div class="nav"><button id="prev" ${s.i===0?'disabled':''}>← আগের</button>
    ${s.mode==='mock'?`<button id="fin">পরীক্ষা শেষ করুন</button>`:''}
    <button class="primary grow" id="next">${last?(s.mode==='practice'?'শেষ, হোমে ফিরুন':'ফলাফল দেখুন'):'পরের →'}</button></div>
  ${st.confirm?`<div class="confirm"><b>${s.ids.length-done}টা প্রশ্নের উত্তর দেওয়া হয়নি। এগুলো ভুল ধরা হবে। শেষ করবেন?</b><div class="nav"><button class="primary" id="yes">হ্যাঁ, ফলাফল দেখান</button><button id="no">না, চালিয়ে যাই</button></div></div>`:''}`;
  app.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{
    s.ans[key]=b.dataset.l;
    if(instant){ if(b.dataset.l===q.a){ if(s.mode==='wrong') st.wrong.delete(key) } else st.wrong.add(key) }
    persist(); const y=window.scrollY; question(); window.scrollTo(0,y);
  });
  document.getElementById('home').onclick=()=>{pause();st.view='home';st.confirm=false;persist();render()};
  document.getElementById('prev').onclick=()=>{s.i--;st.confirm=false;savePos();persist();render()};
  document.getElementById('next').onclick=()=>{
    if(!last){s.i++;savePos();persist();render();return}
    if(s.mode==='practice'){st.pos[s.src]=0;st.sess=null;st.view='home';persist();render();return}
    finish();
  };
  const f=document.getElementById('fin'); if(f) f.onclick=()=>{if(done<s.ids.length){st.confirm=true;question();window.scrollTo(0,document.body.scrollHeight)}else finish()};
  const y=document.getElementById('yes'); if(y) y.onclick=finish;
  const n=document.getElementById('no'); if(n) n.onclick=()=>{st.confirm=false;question()};
  if(s.mode==='mock'){s.start=Date.now()-s.elapsed;tick=setInterval(()=>{s.elapsed=Date.now()-s.start;const c=document.getElementById('clock');if(c)c.textContent=fmt(s.elapsed);if(s.elapsed%10000<1000)persist()},1000)}
}
function pause(){const s=st.sess;if(s&&s.mode==='mock')s.elapsed=Date.now()-s.start;clearInterval(tick)}
function savePos(){const s=st.sess;if(s.mode==='practice')st.pos[s.src]=s.i}
function finish(){
  pause();const s=st.sess;st.confirm=false;
  let right=0;const wrongList=[];
  s.ids.forEach(k=>{if(s.ans[k]===Q[k].a){right++; if(s.mode!=='mock')st.wrong.delete(k)}else{wrongList.push(k);st.wrong.add(k)}});
  st.result={mode:s.mode,src:s.src,total:s.ids.length,right,wrongList,ans:s.ans,elapsed:s.elapsed};
  st.sess=null;st.view='result';persist();render();
}
function result(){
  const r=st.result,pct=Math.round(r.right/r.total*100),pass=pct>=PASS;
  app.innerHTML=`
  <section class="panel"><span class="lbl">${MODE_NAME[r.mode]} · ${SRC_NAME[r.src]}</span>
    <div class="score">${pct}%</div>
    <div><span class="pill ${pass?'ok':'bad'}">${pass?'পাস':'ফেল'}</span> &nbsp; পাস মার্ক ${PASS}%</div>
    <div class="stats"><span>ঠিক: ${r.right}</span><span>ভুল/বাদ: ${r.total-r.right}</span><span>মোট: ${r.total}</span>${r.mode==='mock'?`<span>সময়: ${fmt(r.elapsed)}</span>`:''}</div>
    <div class="nav"><button class="primary grow" id="h">হোমে ফিরুন</button>${r.wrongList.length?`<button id="w">শুধু ভুলগুলো আবার</button>`:''}</div></section>
  ${r.wrongList.length?`<h2>ভুল আর বাদ পড়া প্রশ্ন (${r.wrongList.length})</h2><div class="rev">${r.wrongList.map(k=>{const q=Q[k],a=r.ans[k];
    return `<section class="panel"><span class="qtag">${srcLabel(k)}</span>${k[0]==='t'?`<p class="qtext">${esc(q.q)}</p>`:sq(q)}
    <p class="fb bad" style="margin:0">আপনার উত্তর: ${a?a+')'+(k[0]==='t'?' '+esc(q.o[L.indexOf(a)]):''):'দেওয়া হয়নি'}</p>
    <p class="fb ok" style="margin:0">সঠিক উত্তর: ${q.a})${k[0]==='t'?' '+esc(q.o[L.indexOf(q.a)]):''}</p>
    ${q.e?`<img class="qimg zoom" src="${q.e}" alt="ব্যাখ্যা" loading="lazy">`:''}</section>`}).join('')}</div>`:''}`;
  document.getElementById('h').onclick=()=>{st.view='home';render()};
  const w=document.getElementById('w'); if(w) w.onclick=()=>{st.sess={mode:'wrong',src:r.src,ids:shuffle(r.wrongList),i:0,ans:{},start:Date.now(),elapsed:0};st.view='q';persist();render()};
}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&st.view==='q'){pause();persist()}else if(!document.hidden&&st.view==='q'&&st.sess&&st.sess.mode==='mock'){question()}});
render();
</script>
</body></html>
